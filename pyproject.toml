[project]
name = "lyriframe-kim"
version = "1.4.0"
description = "Local lyric alignment and karaoke subtitle video workflow"
requires-python = ">=3.10,<3.15"

[tool.pytest.ini_options]
testpaths = ["ktv_app/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
extend-exclude = ["models", "tools", ".runtime", "ktv_projects"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"ktv_app/tests/*" = ["F401"]
